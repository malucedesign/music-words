<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>がくごカメラ</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg:#EAE6DD; --card:#F5F2EB; --edge:#DED8CB; --ink:#3D372F;
    --sub:#8A8175; --line:#C8BEA9; --accent:#A88B6A;
    --tempo:#A88B6A; --dyn:#7E8B7A; --expr:#96838F; --tech:#7C8A96;
    --nav:#B07A5E; --word:#9A9186;
    --serif:'游明朝','Yu Mincho','YuMincho','Hiragino Mincho ProN',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:600px;margin:0 auto;padding:34px 20px 72px;}
  header{text-align:center;margin-bottom:26px;}
  .kicker{font-size:12px;letter-spacing:.28em;color:var(--sub);margin-bottom:10px;}
  h1{font-size:27px;font-weight:400;margin:0;letter-spacing:.1em;}
  .lead{font-size:13px;color:var(--sub);margin-top:12px;line-height:1.9;}

  .shoot{width:100%;background:var(--card);border:1px solid var(--edge);
    border-radius:18px;cursor:pointer;color:var(--ink);font-family:var(--serif);
    padding:0;display:block;}
  .shoot-inner{padding:46px 20px;display:flex;flex-direction:column;align-items:center;gap:15px;}
  .lens{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--accent);
    display:flex;align-items:center;justify-content:center;}
  .shoot-t{font-size:18px;letter-spacing:.08em;}
  .shoot-s{font-size:12px;color:var(--sub);}

  #preview{width:100%;border-radius:16px;border:1px solid var(--edge);display:block;margin-bottom:16px;}

  .loading{text-align:center;padding:34px 0;color:var(--sub);font-size:13.5px;letter-spacing:.08em;line-height:2;}
  .spin{width:30px;height:30px;margin:0 auto 16px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;max-width:200px;margin:0 auto;}
  .bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}

  .section-t{font-size:12px;letter-spacing:.2em;color:var(--sub);margin:6px 0 14px;text-align:center;}

  .card{background:var(--card);border:1px solid var(--edge);border-radius:15px;padding:17px 19px;margin-bottom:11px;}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .term{font-size:21px;letter-spacing:.02em;}
  .tag{font-size:10.5px;color:#fff;padding:3px 11px;border-radius:20px;letter-spacing:.06em;white-space:nowrap;}
  .reading{font-size:12.5px;color:var(--sub);margin-top:4px;letter-spacing:.08em;}
  .hr{height:1px;background:var(--line);opacity:.5;margin:12px 0;}
  .meaning{font-size:14.5px;line-height:1.9;}

  .metro{margin-top:14px;}
  .metro-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .play{display:flex;align-items:center;gap:7px;background:transparent;color:var(--accent);
    border:1.3px solid var(--accent);border-radius:22px;padding:7px 15px;font-size:13px;
    cursor:pointer;font-family:var(--serif);letter-spacing:.04em;}
  .play.on{background:var(--accent);color:#fff;}
  .bpm{font-size:20px;letter-spacing:.04em;}
  .bpm small{font-size:11px;color:var(--sub);margin-left:3px;}
  .guide{font-size:11px;color:var(--sub);}
  input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--line);
    border-radius:2px;margin-top:12px;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
    border-radius:50%;background:var(--accent);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--accent);}

  .note-msg{text-align:center;color:var(--sub);font-size:13.5px;line-height:2;padding:18px 0;}

  .again{display:block;margin:22px auto 0;background:transparent;border:none;color:var(--sub);
    font-size:13px;cursor:pointer;font-family:var(--serif);letter-spacing:.1em;
    text-decoration:underline;text-underline-offset:4px;}

  .divider{height:1px;background:var(--line);opacity:.6;margin:40px 0 26px;}

  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;}
  .chip{background:var(--card);border:1px solid var(--edge);color:var(--sub);
    border-radius:20px;padding:6px 15px;font-size:13px;cursor:pointer;font-family:var(--serif);letter-spacing:.05em;}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .search{width:100%;background:var(--card);border:1px solid var(--edge);border-radius:12px;
    padding:12px 16px;font-size:15px;color:var(--ink);font-family:var(--serif);margin-bottom:18px;}
  .search:focus{outline:none;border-color:var(--accent);}
  .search::placeholder{color:var(--sub);}

  .empty{text-align:center;color:var(--sub);font-size:13px;padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">が く ふ の こ と ば</div>
    <h1>がくごカメラ</h1>
    <p class="lead">がくふの きごうや ことばを うつすと<br>よみかたと いみ、はやさが わかるよ</p>
  </header>

  <input id="file" type="file" accept="image/*" capture="environment" hidden />

  <button class="shoot" id="shootBtn">
    <div class="shoot-inner">
      <div class="lens">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#A88B6A" stroke-width="1.4">
          <path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h5L15.5 6H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"/>
          <circle cx="12" cy="12.5" r="3.2"/>
        </svg>
      </div>
      <div class="shoot-t">がくふを うつす</div>
      <div class="shoot-s">アルバムから えらんでもいいよ</div>
    </div>
  </button>

  <div id="stage"></div>

  <div class="divider"></div>

  <div class="section-t">じ て ん か ら さ が す</div>
  <input class="search" id="search" placeholder="ことばを いれてね（れい：allegro）" />
  <div class="chips" id="chips"></div>
  <div id="dict"></div>
</div>

const CAT = {
  tempo:{label:"はやさ",color:"var(--tempo)"},
  dyn:  {label:"つよさ",color:"var(--dyn)"},
  expr: {label:"きもち",color:"var(--expr)"},
  tech: {label:"ひきかた",color:"var(--tech)"},
  nav:  {label:"すすみかた",color:"var(--nav)"},
  word: {label:"ことば",color:"var(--word)"},
};

// ── メトロノーム ─────────────────────────────────────────
let ac=null, metroTimer=null, metroPlaying=null;
function click(){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.frequency.value=1600;
  g.gain.setValueAtTime(0.0001,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.4,ac.currentTime+0.001);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.05);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime+0.06);
}
function metroStop(){
  if(metroTimer) clearInterval(metroTimer);
  metroTimer=null; metroPlaying=null;
  document.querySelectorAll('.play').forEach(b=>{b.classList.remove('on');b.querySelector('.plabel').textContent='このテンポ';});
}
function metroStart(bpm,id,btn){
  if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended') ac.resume();
  metroStop();
  click();
  metroTimer=setInterval(click,60000/bpm);
  metroPlaying=id;
  btn.classList.add('on'); btn.querySelector('.plabel').textContent='とめる';
}

// ── カード描画 ───────────────────────────────────────────
function cardHTML(e,idx){
  const cat=CAT[e.c];
  let metro='';
  if(e.bpm){
    const mid=Math.round((e.bpm[0]+e.bpm[1])/2);
    metro=`<div class="metro">
      <div class="metro-row">
        <button class="play" data-bpm="${mid}" data-id="${idx}">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor"><path d="M2 1l9 5-9 5z"/></svg>
          <span class="plabel">このテンポ</span>
        </button>
        <div class="bpm"><span class="bpmv">${mid}</span><small>bpm</small></div>
        <div class="guide">めやす ${e.bpm[0]}〜${e.bpm[1]}</div>
      </div>
      <input type="range" min="${e.bpm[0]-8}" max="${e.bpm[1]+8}" value="${mid}" class="bslide" data-id="${idx}">
    </div>`;
  }
  return `<div class="card">
    <div class="card-top">
      <div class="term">${e.t}</div>
      <div class="tag" style="background:${cat.color}">${cat.label}</div>
    </div>
    <div class="reading">${e.r}</div>
    <div class="hr"></div>
    <div class="meaning">${e.m}</div>
    ${metro}
  </div>`;
}

function bindCards(root){
  root.querySelectorAll('.play').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.id, bpm=Number(btn.dataset.bpm);
      if(metroPlaying===id){ metroStop(); }
      else { metroStop(); metroStart(bpm,id,btn); }
    });
  });
  root.querySelectorAll('.bslide').forEach(sl=>{
    sl.addEventListener('input',()=>{
      const card=sl.closest('.card');
      const v=Number(sl.value);
      card.querySelector('.bpmv').textContent=v;
      const btn=card.querySelector('.play');
      btn.dataset.bpm=v;
      if(metroPlaying===sl.dataset.id) metroStart(v,sl.dataset.id,btn);
    });
  });
}

// ── OCR照合 ──────────────────────────────────────────────
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9]/g,''); }
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function matchTerms(text){
  const tokens=[...new Set(text.split(/[\s\n]+/).map(norm).filter(w=>w.length>=2))];
  const found=new Map();
  for(const e of DICT){
    let best=Infinity;
    for(const al of e.a){
      const na=norm(al);
      for(const tk of tokens){
        if(na===tk){ best=0; break; }
        if(na.length>=5 && Math.abs(na.length-tk.length)<=2){
          const d=lev(na,tk);
          if((na.length>=5 && d<=1)||(na.length>=7 && d<=2)) best=Math.min(best,d);
        }
      }
      if(best===0) break;
    }
    if(best<Infinity && !found.has(e.t)) found.set(e.t,{e,score:best});
  }
  return [...found.values()].sort((x,y)=>x.score-y.score).map(v=>v.e);
}

// ── 画像まえしょり ───────────────────────────────────────
function preprocess(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{width,height}=img;
        const scale=Math.min(1, 1600/Math.max(width,height));
        // OCRは大きめ・グレースケールが有利
        const up=Math.max(1, Math.min(2, 1400/Math.max(width*scale,height*scale)));
        const w=Math.round(width*scale*up), h=Math.round(height*scale*up);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d'); cx.drawImage(img,0,0,w,h);
        const dt=cx.getImageData(0,0,w,h), p=dt.data;
        for(let i=0;i<p.length;i+=4){
          let g=0.3*p[i]+0.59*p[i+1]+0.11*p[i+2];
          g=(g-128)*1.35+128; // コントラスト
          g=g<0?0:g>255?255:g;
          p[i]=p[i+1]=p[i+2]=g;
        }
        cx.putImageData(dt,0,0);
        const prev=document.createElement('canvas'); prev.width=Math.round(width*scale); prev.height=Math.round(height*scale);
        prev.getContext('2d').drawImage(img,0,0,prev.width,prev.height);
        res({ocr:cv, preview:prev.toDataURL('image/jpeg',0.85)});
      };
      img.onerror=rej; img.src=r.result;
    };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

// ── メイン処理 ───────────────────────────────────────────
const stage=document.getElementById('stage');
const fileInput=document.getElementById('file');
document.getElementById('shootBtn').addEventListener('click',()=>fileInput.click());

fileInput.addEventListener('change',async(ev)=>{
  const file=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!file) return;
  metroStop();
  document.getElementById('shootBtn').style.display='none';
  const {ocr,preview}=await preprocess(file);
  stage.innerHTML=`<img id="preview" src="${preview}" alt="うつした がくふ">
    <div class="loading"><div class="spin"></div>ことばを よみとっています…
      <div class="bar" style="margin-top:14px"><i id="pbar"></i></div></div>`;

  try{
    const worker=await Tesseract.createWorker('eng',1,{
      logger:m=>{ if(m.status==='recognizing text'){ const b=document.getElementById('pbar'); if(b) b.style.width=Math.round(m.progress*100)+'%'; } }
    });
    await worker.setParameters({ tessedit_pageseg_mode:'11' });
    const {data}=await worker.recognize(ocr);
    await worker.terminate();

    const hits=matchTerms(data.text||'');
    stage.innerHTML=`<img id="preview" src="${preview}" alt="うつした がくふ">`
      +`<div id="ocrArea"></div>`
      +`<button class="again" id="againBtn">べつの がくふを うつす</button>`;
    const area=document.getElementById('ocrArea');

    if(hits.length===0){
      area.innerHTML=`<div class="note-msg">ことばが みつからなかったよ。<br>もじが おおきく うつるように とるか、<br>したの じてんから さがしてね。</div>`;
    }else if(hits.length===1){
      area.innerHTML=`<div class="section-t">み つ け た こ と ば</div>`+cardHTML(hits[0],'ocr0');
      bindCards(area);
    }else{
      // 候補が いくつか → タップで えらぶ
      area.innerHTML=`<div class="section-t">ど れ を し ら べ る ？</div>`
        +`<div class="chips" id="ocrChoices"></div><div id="picked"></div>`;
      const choices=document.getElementById('ocrChoices');
      const picked=document.getElementById('picked');
      hits.forEach((e,i)=>{
        const b=document.createElement('button');
        b.className='chip'; b.dataset.i=i;
        b.innerHTML=`${e.t}<span style="font-size:11px;margin-left:5px;opacity:.6">${e.r}</span>`;
        b.addEventListener('click',()=>{
          metroStop();
          const wasOn=b.classList.contains('on');
          choices.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
          if(wasOn){ picked.innerHTML=''; return; }
          b.classList.add('on');
          picked.innerHTML=cardHTML(e,'pick'+i);
          bindCards(picked);
        });
        choices.appendChild(b);
      });
    }
    document.getElementById('againBtn').addEventListener('click',resetStage);
  }catch(err){
    stage.innerHTML=`<img id="preview" src="${preview}" alt="うつした がくふ">
      <div class="note-msg">うまく よみとれなかったよ。<br>あかるい ところで、もう いちど とってみてね。</div>
      <button class="again" id="againBtn">もう いちど</button>`;
    document.getElementById('againBtn').addEventListener('click',resetStage);
  }
});

function resetStage(){
  metroStop();
  stage.innerHTML='';
  document.getElementById('shootBtn').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── じてん（一覧） ───────────────────────────────────────
const chipsEl=document.getElementById('chips');
const dictEl=document.getElementById('dict');
const searchEl=document.getElementById('search');
let curCat='all', curQ='';

const chipDefs=[['all','ぜんぶ'],['tempo','はやさ'],['dyn','つよさ'],['expr','きもち'],['tech','ひきかた'],['nav','すすみかた'],['word','ことば']];
chipDefs.forEach(([k,l])=>{
  const b=document.createElement('button');
  b.className='chip'+(k==='all'?' on':''); b.textContent=l; b.dataset.k=k;
  b.addEventListener('click',()=>{ curCat=k; chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===k)); renderDict(); });
  chipsEl.appendChild(b);
});
searchEl.addEventListener('input',()=>{ curQ=norm(searchEl.value); renderDict(); });

function renderDict(){
  const list=DICT.filter(e=>{
    if(curCat!=='all' && e.c!==curCat) return false;
    if(curQ){
      const hay=norm(e.t)+norm(e.r)+e.a.map(norm).join('')+e.m;
      if(!hay.includes(curQ)) return false;
    }
    return true;
  });
  if(!list.length){ dictEl.innerHTML=`<div class="empty">みつからなかったよ</div>`; return; }
  dictEl.innerHTML=list.map((e,i)=>cardHTML(e,'d'+i)).join('');
  bindCards(dictEl);
}
renderDict();
